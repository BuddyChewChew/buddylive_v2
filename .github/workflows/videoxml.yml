name: Live TV EPG Generator

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *' # every 4 hours; adjust as needed

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: live-epg-generator
  cancel-in-progress: true

jobs:
  generate-and-pr:
    name: Generate EPG, sanitize, and open PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install system deps (Chromium + libs)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y chromium-browser chromium-chromedriver fonts-liberation \
            libnss3 libxss1 libasound2 libatk1.0-0 libgtk-3-0
          # ensure expected binary exists
          if [ -x /usr/bin/chromium ] && [ ! -x /usr/bin/chromium-browser ]; then
            sudo ln -s /usr/bin/chromium /usr/bin/chromium-browser || true
          fi

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pytz selenium webdriver-manager selenium-stealth

      - name: Ensure output directory exists
        run: mkdir -p en

      - name: Run EPG generator
        env:
          TZ: America/New_York
          CHROME_PATH: /usr/bin/chromium-browser
        run: |
          python py/videolivetv.py > en/videoall.m3u
          python py/videoxml_clean.py
          mv -f epg.xml en/videoall.xml

      - name: Sanitize generated files
        run: |
          python py/sanitize_epg.py

      - name](#)*
