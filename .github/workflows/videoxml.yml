name: Live TV EPG Generator

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *' # adjust frequency if needed

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: live-epg-generator
  cancel-in-progress: true

jobs:
  generate-and-pr:
    name: Generate EPG and open PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pytz selenium webdriver-manager selenium-stealth gunicorn

      - name: Run EPG generator
        id: generate
        run: |
          # Run your existing generator commands; these must produce en/videoall.m3u and en/videoall.xml
          python py/videolivetv.py > en/videoall.m3u
          python py/videoxml_clean.py
          mv -f epg.xml en/videoall.xml
        env:
          TZ: America/New_York

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check for repository changes
        id: changes
        run: |
          git status --porcelain
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit changes to a feature branch
        if: steps.changes.outputs.changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "[skip ci] Auto update EPG files"
          branch: feature/auto-epg-update-${{ github.run_id }}
          file_pattern: |
            en/videoall.m3u
            en/videoall.xml
          author_name: github-actions[bot]
          author_email: 41898282+github-actions[bot]@users.noreply.github.com
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: feature/auto-epg-update-${{ github.run_id }}
          base: main
          title: "Auto update EPG files"
          body: |
            This PR was created automatically by the Live TV EPG Generator workflow.
            The commit includes [skip ci] to avoid re-triggering workflows.
          labels: automated,epg
          draft: false
