name: ▶️ Live TV And EPG Generator

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scrape_and_generate_epg:
    name: Scrape TV Programming and Generate EPG
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pytz selenium webdriver-manager selenium-stealth

      - name: Run Scraper and EPG Generator
        run: |
          mkdir -p en
          # Generate M3U
          python py/videolivetv.py > en/videoall.m3u
          # Generate EPG
          python py/videoxml_clean.py
          mv -f epg.xml en/videoall.xml
        env:
          TZ: America/New_York

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Auto-update Playlist and EPG"
          file_pattern: 'en/*'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
