name: ▶️ Live TV And EPG Generator

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Runs every 4 hours at 00:00, 04:00, 12:00 UTC
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  scrape_and_generate_epg:
    name: Scrape TV Programming and Generate EPG
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pytz selenium webdriver-manager selenium-stealth gunicorn

      - name: Generate Live TV M3U
        run: |
          python py/videolivetv.py > en/videoall.m3u
        env:
          TZ: America/New_York  # Set the timezone
          
      - name: Generate EPG XML
        run: |
          python py/videoxml_clean.py
          mv epg.xml en/videoall.xml


      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Updated"
          files: |
            en/videoall.m3u
            en/videoall.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

